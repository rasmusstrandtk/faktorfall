<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Faktorfall</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2304070a'/><path fill='%234cff9a' d='M10 6h12v3H10zm-3 3h18v6H7zm2 6h14v5H9zm-3 5h5v6H6zm14 0h5v6h-5z'/><rect x='10' y='11' width='3' height='3' fill='%2304070a'/><rect x='19' y='11' width='3' height='3' fill='%2304070a'/><rect x='14' y='16' width='4' height='2' fill='%23ffd23f'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --skjerm:#04070a;
    --fosfor:#4cff9a;
    --fosfor-dim:#1c7a4a;
    --cyan:#4df0ff;
    --gul:#ffd23f;
    --rod:#ff4d5e;
    --arkade:"Press Start 2P","Courier New",monospace;
    --brod:"IBM Plex Mono",ui-monospace,"Courier New",monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    background:#000;
    background-image:radial-gradient(ellipse at 50% 0%, #0d1b16 0%, #000 70%);
    color:var(--fosfor);
    font-family:var(--brod);
    display:flex; flex-direction:column;
    overflow:hidden; user-select:none;
  }

  header{
    flex:none;
    display:flex; align-items:center; gap:14px;
    padding:9px 14px;
    border-bottom:2px solid #123;
  }
  .tittel{
    font-family:var(--arkade);
    font-size:17px;
    color:var(--fosfor);
    text-shadow:0 0 12px rgba(76,255,154,.55);
    letter-spacing:1px;
  }
  .tittel em{ font-style:normal; color:var(--gul); text-shadow:0 0 12px rgba(255,210,63,.5) }
  .verktoy{ margin-left:auto; display:flex; gap:8px }
  .tast{
    font-family:var(--arkade);
    font-size:9px;
    color:var(--fosfor);
    background:#07120d;
    border:2px solid var(--fosfor-dim);
    padding:9px 11px;
    cursor:pointer;
  }
  .tast:hover{ background:#0d2018; border-color:var(--fosfor) }
  .tast:focus-visible{ outline:2px solid var(--gul); outline-offset:2px }

  main{
    flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column; align-items:center;
    padding:10px; gap:12px;
  }
  #ramme{
    position:relative; flex:none;
    padding:10px;
    border:3px solid var(--fosfor-dim);
    border-radius:4px;
    background:#02050a;
    box-shadow:0 0 0 3px #000, 0 0 34px rgba(76,255,154,.16), inset 0 0 40px rgba(0,0,0,.9);
  }
  canvas{ display:block; background:var(--skjerm); touch-action:manipulation }

  #pad{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; flex:none }
  .prim{
    min-width:76px; height:64px;
    background:#07120d;
    border:3px solid var(--fosfor-dim);
    color:var(--fosfor);
    font-family:var(--arkade);
    font-size:22px;
    cursor:pointer;
    text-shadow:0 0 10px rgba(76,255,154,.5);
    transition:background .07s, transform .07s, border-color .07s;
  }
  .prim:hover{ border-color:var(--fosfor) }
  .prim:active,.prim.trykk{
    background:var(--fosfor); color:#04120a; transform:translateY(3px);
    text-shadow:none;
  }
  .prim:focus-visible{ outline:2px solid var(--gul); outline-offset:3px }

  #skjerm{
    position:absolute; inset:10px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(2,6,10,.93);
    padding:22px; text-align:center;
  }
  #skjerm.skjult{ display:none }
  .kort{ max-width:560px }
  .kort h1{
    font-family:var(--arkade); font-size:30px; line-height:1.35;
    margin:0 0 4px; color:var(--fosfor);
    text-shadow:0 0 16px rgba(76,255,154,.55);
  }
  .kort h1 em{ font-style:normal; color:var(--gul) }
  .kort p{ font-size:14px; line-height:1.6; color:#9fe9c4; margin:12px 0 }
  .kort ol{ text-align:left; font-size:13.5px; line-height:1.7; color:#9fe9c4; margin:14px 0 20px; padding-left:22px }
  .kort ol b{ color:var(--gul); font-weight:600 }
  .fasit{ font-family:var(--arkade); font-size:13px; color:var(--gul); line-height:2.1; margin:16px 0 22px }
  .fasit span{ color:var(--fosfor) }
  .start{
    font-family:var(--arkade); font-size:13px;
    background:var(--fosfor); color:#04120a;
    border:none; padding:16px 26px; cursor:pointer;
    box-shadow:0 5px 0 #1c7a4a;
  }
  .start:active{ transform:translateY(4px); box-shadow:0 1px 0 #1c7a4a }
  .start:focus-visible{ outline:3px solid var(--gul); outline-offset:3px }
  .blink{ animation:blink 1.1s steps(2,end) infinite }
  @keyframes blink{ 50%{opacity:.25} }
  @media (prefers-reduced-motion:reduce){ .blink{animation:none} }
  
  @media (max-width:600px){
    header{ flex-wrap:wrap; justify-content:center; padding:8px; gap:8px }
    .verktoy{ margin-left:0; width:100%; justify-content:center }
    #skjerm{ padding:10px }
    .kort h1{ font-size:24px }
    .kort p, .kort ol{ font-size:12px; margin:10px 0 }
    .kort ol{ padding-left:16px }
    .start{ padding:12px 20px; font-size:11px }
  }
</style>
</head>
<body>

<header>
  <div class="tittel">FAKTOR<em>FALL</em></div>
  <div class="verktoy">
    <button class="tast" id="knapp-lyd">LYD PÅ</button>
    <button class="tast" id="knapp-pause">PAUSE</button>
  </div>
</header>

<main>
  <div id="ramme">
    <canvas id="lerret"></canvas>
    <div id="skjerm"><div class="kort" id="kort"></div></div>
  </div>
  <div id="pad"></div>
</main>

<script>
(function(){
"use strict";

/* ===== oppsett ===== */
const VB=800, VH=600;
const HUD=44, BAKKE=VH-70;
const lerret=document.getElementById('lerret');
const ctx=lerret.getContext('2d');
const ARKADE='"Press Start 2P","Courier New",monospace';

// Tilpasset for 8. trinn: Mer tid til å tenke når primtallene 7 og 11 kommer
const NIVAER=[
  {primer:[2,3,5],         min:12, maks:100, fart:16, slipp:5.5, maksStein:2},
  {primer:[2,3,5,7],       min:20, maks:200, fart:20, slipp:5.0, maksStein:2},
  {primer:[2,3,5,7,11],    min:30, maks:300, fart:24, slipp:4.5, maksStein:2},
  {primer:[2,3,5,7,11,13], min:40, maks:400, fart:28, slipp:4.0, maksStein:3},
  {primer:[2,3,5,7,11,13], min:60, maks:600, fart:34, slipp:3.5, maksStein:3},
  {primer:[2,3,5,7,11,13,17], min:100, maks:900, fart:38, slipp:3.2, maksStein:3},
  {primer:[2,3,5,7,11,13,17,19], min:150, maks:1300, fart:42, slipp:3.0, maksStein:4},
  {primer:[2,3,5,7,11,13,17,19], min:200, maks:2000, fart:46, slipp:2.8, maksStein:4}
];
const KNUST_PER_NIVA=8;

let tilstand='intro';
let niva=1, poeng=0, liv=3, knust=0;
let beste = parseInt(localStorage.getItem('faktorfall_beste') || '0', 10);
let steiner=[], skudd=[], gnister=[], tekster=[];
let valgt=null, slippTimer=0, risting=0, banner=0, bannerTekst='';
let straffeTimer=0;
let sisteTid=0, aktivePrimer=[], marsj=0, marsjTakt=0;
let lydPa=true, lydCtx=null;

const stjerner=[];
for(let i=0;i<60;i++) stjerner.push({x:Math.random()*VB, y:HUD+Math.random()*(BAKKE-HUD-40), r:Math.random()<.8?1:2, f:Math.random()*6.3});

/* bunkere, som i Space Invaders */
let bunkere=[];
function nyeBunkere(){
  bunkere=[];
  for(let i=0;i<4;i++){
    const celler=[];
    for(let r=0;r<4;r++) for(let c=0;c<7;c++){
      if(r===3 && c>1 && c<5) continue;
      celler.push({c:c,r:r,liv:true});
    }
    bunkere.push({x:[62,208,494,640][i], y:BAKKE-50, b:98, celler:celler});
  }
}

/* ===== hjelp ===== */
function erPrim(n){
  if(n<2) return false;
  if(n%2===0) return n===2;
  for(let i=3;i*i<=n;i+=2) if(n%i===0) return false;
  return true;
}
function cfg(){ return NIVAER[Math.min(niva-1,NIVAER.length-1)]; }

function nyVerdi(c){
  for(let f=0;f<300;f++){
    let v=1,n=0;
    const antall=2+Math.floor(Math.random()*3);
    while(n<antall){
      const p=c.primer[Math.floor(Math.random()*c.primer.length)];
      if(v*p>c.maks) break;
      v*=p; n++;
    }
    if(n>=2 && v>=c.min) return v;
  }
  return 12;
}
function bredde(v){ return 34+String(v).length*30; }

function nyStein(){
  const c=cfg(), v=nyVerdi(c), b=bredde(v);
  let x=0;
  for(let f=0;f<24;f++){
    x = b/2+14+Math.random()*(VB-b-28);
    let fri=true;
    for(const s of steiner) if(Math.abs(s.x-x) < (s.b+b)/2+40 && s.y < HUD+180) fri=false;
    if(fri) break;
  }
  return {
    start:v, v:v, funnet:[],
    b:b, h:64,
    x:x,
    y:-60,
    fart:c.fart*(.85+Math.random()*.3),
    blink:0
  };
}
function radius(s){ return Math.max(s.b,s.h)/2; }
function lavesteStein(){ let b=null; for(const s of steiner) if(!b||s.y>b.y) b=s; return b; }
function mal(){ return (valgt && steiner.indexOf(valgt)>=0) ? valgt : lavesteStein(); }

/* ===== lyd ===== */
function pip(frek,lengde,type,vol){
  if(!lydPa) return;
  try{
    if(!lydCtx) lydCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=lydCtx.createOscillator(), g=lydCtx.createGain();
    o.type=type||'square'; o.frequency.value=frek;
    g.gain.value=vol||.06;
    g.gain.exponentialRampToValueAtTime(.0001,lydCtx.currentTime+lengde);
    o.connect(g); g.connect(lydCtx.destination);
    o.start(); o.stop(lydCtx.currentTime+lengde);
  }catch(e){}
}

/* ===== handlinger ===== */
function skyt(p){
  if(tilstand!=='spill' || straffeTimer>0) return;
  const t=mal(); if(!t) return;
  skudd.push({p:p, x:VB/2, y:BAKKE-26, mal:t});
  pip(380,.05,'square');
}

function treff(s,p){
  s.v=s.v/p; s.funnet.push(p);
  poeng+=10;
  flyt(s.x,s.y,':'+p,'#4df0ff');
  if(s.v===1){
    const bonus=20+10*s.funnet.length;
    poeng+=bonus; knust++;
    const fasit=s.start+' = '+s.funnet.slice().sort((a,b)=>a-b).join('·');
    sprengning(s.x,s.y,'#ffd23f',30);
    flyt(Math.max(140,Math.min(VB-140,s.x)), s.y-34, fasit, '#ffd23f');
    pip(880,.09,'square'); setTimeout(()=>pip(1180,.14,'square'),80);
    steiner.splice(steiner.indexOf(s),1);
    if(valgt===s) valgt=null;
    fyllPa();
    if(knust%KNUST_PER_NIVA===0 && niva<NIVAER.length){
      niva++; byggPad(); banner=2.2; bannerTekst='NIVÅ '+niva;
    }
  }else{
    s.b=bredde(s.v);
  }
}

function bom(s,p){
  s.blink=.45; s.fart*=1.3;
  poeng=Math.max(0,poeng-20);
  straffeTimer=1.5;
  pip(150,.2,'sawtooth',.08);
  flyt(s.x, s.y-s.h/2-16, s.v+' : '+p+' går ikke', '#ff4d5e');
  flyt(VB/2, BAKKE-50, 'KANON LÅST!', '#ff4d5e');
}

function nedslag(s){
  liv--; risting=.55;
  sprengning(s.x,BAKKE-12,'#ff4d5e',34);
  steiner.splice(steiner.indexOf(s),1);
  if(valgt===s) valgt=null;
  fyllPa();
  if(liv<=0) slutt();
}

/* bunkeren fanger opp ett tall og mister blokkene der treffet kom */
function bunkerFanger(s){
  for(const b of bunkere){
    if(s.y+s.h/2 < b.y) continue;
    const x0=s.x-s.b/2, x1=s.x+s.b/2;
    if(x1 < b.x || x0 > b.x+b.b) continue;
    const truffet=b.celler.filter(c=>c.liv && (b.x+c.c*14+13)>x0 && (b.x+c.c*14)<x1);
    if(truffet.length){
      truffet.forEach(c=>c.liv=false);
      sprengning(s.x, b.y, '#2ecc71', 22);
      flyt(s.x, b.y-24, 'BUNKEREN TOK DEN', '#2ecc71');
      steiner.splice(steiner.indexOf(s),1);
      if(valgt===s) valgt=null;
      fyllPa();
      risting=.25;
      return true;
    }
  }
  return false;
}

function sprengning(x,y,farge,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.3, f=70+Math.random()*230;
    gnister.push({x:x,y:y,vx:Math.cos(a)*f,vy:Math.sin(a)*f,t:0,levetid:.45+Math.random()*.5,farge:farge});
  }
}
function flyt(x,y,txt,farge){ tekster.push({x:x,y:y,txt:txt,farge:farge,t:0}); }

/* etter at et tall er ute av veien skal neste komme raskere, men gi litt tenkepause */
function fyllPa(){
  if (steiner.length === 0) {
    slippTimer = 1.5;
  } else if (slippTimer > 2.5) {
    slippTimer = 2.5;
  }
}

/* ===== logikk ===== */
function steg(dt){
  const c=cfg();
  slippTimer-=dt;
  if(straffeTimer>0) straffeTimer-=dt;
  if(slippTimer<=0 && steiner.length<c.maksStein){ steiner.push(nyStein()); slippTimer=c.slipp; }

  marsjTakt+=dt;
  if(marsjTakt>.55){ marsjTakt=0; marsj=1-marsj; }

  for(let i=steiner.length-1;i>=0;i--){
    const s=steiner[i];
    s.y+=s.fart*dt;
    if(s.blink>0) s.blink-=dt;
    if(bunkerFanger(s)) continue;
    if(s.y+s.h/2>=BAKKE) nedslag(s);
  }

  for(let i=skudd.length-1;i>=0;i--){
    const sk=skudd[i];
    if(steiner.indexOf(sk.mal)<0){ skudd.splice(i,1); continue; }
    const dx=sk.mal.x-sk.x, dy=sk.mal.y-sk.y, d=Math.hypot(dx,dy)||1;
    const fart=1050*dt;
    if(d<=radius(sk.mal)+fart){
      if(sk.mal.v%sk.p===0) treff(sk.mal,sk.p); else bom(sk.mal,sk.p);
      skudd.splice(i,1);
    }else{ sk.x+=dx/d*fart; sk.y+=dy/d*fart; }
  }

  for(let i=gnister.length-1;i>=0;i--){
    const g=gnister[i]; g.t+=dt; g.x+=g.vx*dt; g.y+=g.vy*dt; g.vy+=360*dt;
    if(g.t>g.levetid) gnister.splice(i,1);
  }
  for(let i=tekster.length-1;i>=0;i--){
    const t=tekster[i]; t.t+=dt; t.y-=24*dt;
    if(t.t>1.5) tekster.splice(i,1);
  }
  if(risting>0) risting-=dt;
  if(banner>0) banner-=dt;
}

/* ===== tegning ===== */
function px(x,y,w,h){ ctx.fillRect(Math.round(x),Math.round(y),w,h); }

function tegnKanon(x,y,farge){
  ctx.fillStyle=farge;
  px(x-26,y+10,52,8);
  px(x-18,y+2,36,8);
  px(x-4,y-10,8,12);
}

function tegnInvader(s,erMal,tid){
  const b=s.b, h=s.h, x=s.x, y=s.y;
  const v=String(s.v);
  const sistePrim=erPrim(s.v);
  let farge = s.blink>0 ? '#ff4d5e' : (sistePrim ? '#ffd23f' : '#4cff9a');

  ctx.save();
  ctx.shadowColor=farge; ctx.shadowBlur=14;
  ctx.fillStyle=farge;

  // antenner
  const a=marsj?5:-5;
  px(x-b/2+8+a, y-h/2-10, 10, 10);
  px(x+b/2-18-a, y-h/2-10, 10, 10);
  // kropp: ramme av blokker
  px(x-b/2, y-h/2, b, 8);
  px(x-b/2, y+h/2-8, b, 8);
  px(x-b/2, y-h/2, 8, h);
  px(x+b/2-8, y-h/2, 8, h);
  // bein
  const l=marsj?0:8;
  px(x-b/2+6, y+h/2+l, 10, 10);
  px(x+b/2-16, y+h/2+(8-l), 10, 10);

  // tallet
  let str=30;
  ctx.font='400 '+str+'px '+ARKADE;
  while(ctx.measureText(v).width>b-26 && str>12){ str-=2; ctx.font='400 '+str+'px '+ARKADE; }
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(v,x,y+2);
  ctx.restore();

  // faktorer funnet så langt
  if(s.funnet.length){
    ctx.save();
    ctx.globalAlpha=.85;
    ctx.fillStyle='#1c7a4a';
    ctx.font='400 11px '+ARKADE;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(s.funnet.join('·'), x, y+h/2+22);
    ctx.restore();
  }

  if(erMal){
    ctx.save();
    ctx.strokeStyle= sistePrim ? '#ffd23f' : '#4df0ff';
    ctx.lineWidth=2;
    ctx.setLineDash([8,8]); ctx.lineDashOffset=-tid*36;
    ctx.strokeRect(x-b/2-10, y-h/2-16, b+20, h+32);
    ctx.restore();
    if(sistePrim){
      ctx.save();
      ctx.globalAlpha=.55+.45*Math.sin(tid*7);
      ctx.fillStyle='#ffd23f';
      ctx.font='400 11px '+ARKADE;
      ctx.textAlign='center';
      ctx.fillText('PRIMTALL – SKYT DET SELV', x, y-h/2-26);
      ctx.restore();
    }
  }
}

function tegn(tid){
  ctx.clearRect(0,0,VB,VH);
  ctx.fillStyle='#04070a'; ctx.fillRect(0,0,VB,VH);
  ctx.save();
  if(risting>0) ctx.translate((Math.random()-.5)*12*risting*2,(Math.random()-.5)*12*risting*2);

  // stjerner
  for(const st of stjerner){
    ctx.globalAlpha=.25+.3*Math.sin(tid*1.4+st.f);
    ctx.fillStyle='#4cff9a';
    px(st.x,st.y,st.r,st.r);
  }
  ctx.globalAlpha=1;

  // bakke
  ctx.fillStyle='#1c7a4a';
  px(0,BAKKE,VB,4);

  // bunkere
  for(const b of bunkere){
    ctx.fillStyle='#2ecc71';
    for(const c of b.celler) if(c.liv) px(b.x+c.c*14, b.y+c.r*11, 13, 10);
  }

  // kanon
  const kanonFarge = straffeTimer > 0 ? '#ff4d5e' : '#4cff9a';
  tegnKanon(VB/2, BAKKE-34, kanonFarge);

  // siktelinje
  const t=mal();
  if(t && tilstand==='spill'){
    ctx.save();
    ctx.globalAlpha=.3; ctx.setLineDash([4,12]);
    ctx.strokeStyle='#4df0ff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(VB/2,BAKKE-30); ctx.lineTo(t.x,t.y); ctx.stroke();
    ctx.restore();
  }

  for(const s of steiner) tegnInvader(s, s===t, tid);

  for(const sk of skudd){
    ctx.save();
    ctx.shadowColor='#4df0ff'; ctx.shadowBlur=12;
    ctx.fillStyle='#4df0ff';
    px(sk.x-3, sk.y-10, 6, 20);
    ctx.font='400 13px '+ARKADE;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(String(sk.p), sk.x, sk.y-24);
    ctx.restore();
  }

  for(const g of gnister){
    ctx.globalAlpha=Math.max(0,1-g.t/g.levetid);
    ctx.fillStyle=g.farge; px(g.x-3,g.y-3,6,6);
  }
  ctx.globalAlpha=1;

  for(const tk of tekster){
    ctx.globalAlpha=Math.max(0,1-tk.t/1.5);
    ctx.fillStyle=tk.farge;
    ctx.font='400 14px '+ARKADE;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(tk.txt,tk.x,tk.y);
  }
  ctx.globalAlpha=1;

  if(banner>0){
    ctx.globalAlpha=Math.min(1,banner);
    ctx.fillStyle='#ffd23f';
    ctx.font='400 38px '+ARKADE;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(bannerTekst, VB/2, VH/2-50);
    ctx.globalAlpha=1;
  }

  ctx.restore();

  // hud, tegnet over alt så tallene sklir ut bak den
  ctx.fillStyle='rgba(4, 7, 10, 0.6)';
  ctx.fillRect(0,0,VB,HUD);
  ctx.fillStyle='#4cff9a';
  ctx.font='400 14px '+ARKADE;
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('POENG '+String(poeng).padStart(5,'0'), 16, 24);
  ctx.textAlign='center';
  ctx.fillText('NIVÅ '+niva, VB/2, 24);
  for(let i=0;i<liv;i++) tegnKanon(VB-40-i*46, 14, '#4cff9a');
  ctx.strokeStyle='#123d2a'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,HUD); ctx.lineTo(VB,HUD); ctx.stroke();

  // skannelinjer
  ctx.globalAlpha=.16; ctx.fillStyle='#000';
  for(let y=0;y<VH;y+=4) ctx.fillRect(0,y,VB,2);
  ctx.globalAlpha=1;
}

function loop(na){
  const tid=na/1000;
  let dt=sisteTid?tid-sisteTid:0;
  sisteTid=tid;
  if(dt>.05) dt=.05;
  if(tilstand==='spill') steg(dt);
  tegn(tid);
  requestAnimationFrame(loop);
}

/* ===== grensesnitt ===== */

function byggPad(){
  const pad=document.getElementById('pad');
  pad.innerHTML='';
  aktivePrimer=cfg().primer.slice();
  aktivePrimer.forEach(p=>{
    const b=document.createElement('button');
    b.className='prim'; b.textContent=p; b.dataset.prim=p;
    b.addEventListener('click',()=>skyt(p));
    pad.appendChild(b);
  });
}

function visSkjerm(html){
  document.getElementById('kort').innerHTML=html;
  document.getElementById('skjerm').classList.remove('skjult');
}
function skjulSkjerm(){ document.getElementById('skjerm').classList.add('skjult'); }

function intro(){
  tilstand='intro';
  const rekordHtml = beste > 0 ? '<p class="fasit" style="margin:0 0 10px 0;">DIN REKORD: <span>'+beste+'</span></p>' : '';
  visSkjerm(
    '<h1>FAKTOR<em>FALL</em></h1>'+
    rekordHtml +
    '<p>Sammensatte tall angriper ovenfra. Skyt dem i stykker med primtall til det ikke er noe igjen.</p>'+
    '<ol>'+
      '<li>Trykk på et primtall for å skyte det mot tallet nærmest bakken.</li>'+
      '<li>Går det opp, deles tallet: <b>84 → 42 → 21 → 7 → 1</b>.</li>'+
      '<li>Siste primtallet må også skytes. Rammen blir gul når bare primtallet står igjen.</li>'+
      '<li>Bommer du, faller tallet raskere. Treffer det bakken, mister du en kanon.</li>'+
      '<li>Bunkerne nederst fanger opp ett tall hver gang, men smuldrer vekk der treffet kom.</li>'+
      '<li>Trykk på et annet tall for å sikte på det i stedet. Tastene 1–8 skyter også.</li>'+
    '</ol>'+
    '<button class="start blink" id="knapp-start">TRYKK FOR Å STARTE</button>'
  );
  document.getElementById('knapp-start').addEventListener('click',start);
  document.getElementById('knapp-start').focus();
}

function start(){
  niva=1; poeng=0; liv=3; knust=0;
  steiner=[]; skudd=[]; gnister=[]; tekster=[];
  valgt=null; slippTimer=0.4; risting=0; banner=0; straffeTimer=0;
  nyeBunkere(); byggPad(); skjulSkjerm();
  tilstand='spill';
}

function slutt(){
  tilstand='slutt';
  if(poeng > beste){
    beste = poeng;
    localStorage.setItem('faktorfall_beste', beste.toString());
  }
  visSkjerm(
    '<h1>GAME OVER</h1>'+
    '<p class="fasit">POENG <span>'+poeng+'</span><br>TALL FAKTORISERT <span>'+knust+'</span><br>NIVÅ <span>'+niva+'</span><br>BESTE I ØKTA <span>'+beste+'</span></p>'+
    '<button class="start" id="knapp-start">SPILL IGJEN</button>'
  );
  document.getElementById('knapp-start').addEventListener('click',start);
  document.getElementById('knapp-start').focus();
}

function pause(){
  if(tilstand!=='spill') return;
  tilstand='pause';
  visSkjerm('<h1>PAUSE</h1><p>Spillet står stille.</p><button class="start" id="knapp-start">FORTSETT</button>');
  document.getElementById('knapp-start').addEventListener('click',fortsett);
  document.getElementById('knapp-start').focus();
}
function fortsett(){ if(tilstand==='pause'){ skjulSkjerm(); tilstand='spill'; } }

document.getElementById('knapp-pause').addEventListener('click',()=>{ tilstand==='spill'?pause():fortsett(); });
document.getElementById('knapp-lyd').addEventListener('click',e=>{
  lydPa=!lydPa; e.target.textContent=lydPa?'LYD PÅ':'LYD AV';
});

lerret.addEventListener('pointerdown',e=>{
  if(tilstand!=='spill') return;
  const r=lerret.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*VB;
  const y=(e.clientY-r.top)/r.height*VH;
  for(const s of steiner){
    if(Math.abs(s.x-x)<=s.b/2+14 && Math.abs(s.y-y)<=s.h/2+14){ valgt=s; break; }
  }
});

window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ tilstand==='spill'?pause():fortsett(); return; }
  if(tilstand!=='spill') return;
  const n=parseInt(e.key,10);
  if(n>=1 && n<=aktivePrimer.length){
    const p=aktivePrimer[n-1];
    skyt(p);
    const b=document.querySelector('.prim[data-prim="'+p+'"]');
    if(b){ b.classList.add('trykk'); setTimeout(()=>b.classList.remove('trykk'),90); }
  }
});
window.addEventListener('blur',()=>{ if(tilstand==='spill') pause(); });

/* ===== skalering ===== */
function skaler(){
  const h1=document.querySelector('header').offsetHeight;
  const padH=document.getElementById('pad').offsetHeight||76;
  const ledigH=window.innerHeight-h1-padH-58;
  const ledigB=Math.min(document.querySelector('main').clientWidth-28,1000);
  let b=Math.max(300, Math.min(ledigB, ledigH*(VB/VH)));
  const dpr=window.devicePixelRatio||1;
  lerret.style.width=b+'px';
  lerret.style.height=b*(VH/VB)+'px';
  lerret.width=Math.round(VB*dpr);
  lerret.height=Math.round(VH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled=false;
}
window.addEventListener('resize',skaler);

nyeBunkere(); byggPad(); skaler(); intro();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(skaler);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
